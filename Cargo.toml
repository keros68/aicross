[package]
name = "aicross"
version = "0.3.5"
edition = "2021"
description = "ai-cross skill 的桌面面板与多厂商 agent 派发引擎"
license = "MIT"
repository = "https://github.com/keros68/aicross"
keywords = ["ai", "agent", "llm", "code-review"]
categories = ["command-line-utilities", "development-tools"]
build = "build.rs"

[[bin]]
name = "aicross"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Regex（dispatch / channels / resources 的文本判定与脱敏）
regex = "1"

# 不开 devtools 特性：安装版不提供开发者工具，开发构建自带。
tauri = { version = "2", features = [] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Graph.nodes 用 IndexMap 保持插入序，与前端 JS 对象的键序语义一致
# （修正轮验收查找、遗留节点复用、latest_leaf 平局都按插入序）。
indexmap = { version = "2", features = ["serde"] }
serde_yaml = "0.9"
# TASK-50：skill 内置包（skill-bundle/ai-cross）编进可执行文件；体积影响见
# tasks/REPORT-50.md。
include_dir = "0.7"
# 读 kimi 的模型清单（~/.kimi-code/config.toml 的 [models]）
toml = "0.9"
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# 只有金标准重放（src/engine/golden.rs）依赖 serde_json::Value 对象的插入序
# （与 JS 对象键序对齐），生产代码不依赖 Map 的键序，因此 preserve_order 只在
# 测试构建打开：特性按构建种类统一，正常构建的 serde_json::Map 仍是 BTreeMap。
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
# panic 直接结束进程，不带展开表，减小体积；命令错误一律走 Result。
panic = "abort"
codegen-units = 1

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 同一时间只开一个窗口：再次启动时把已开的窗口带到前台，并转发 `aicross open <run_id>`。
tauri-plugin-single-instance = "2"
# 软件自动更新：查 GitHub Release 的 latest.json，下载安装包、校验签名后安装并重启。
tauri-plugin-updater = "2"
# TASK-50：窗口「选目录」对话框，只在 Rust 侧调用（pick_folder 命令），
# 前端不装 npm 包。
tauri-plugin-dialog = "2"

# Windows 接口：Dwm 设窗口直角；Console 让命令行子命令输出到父终端；
# Threading 与 JobObjects 查进程存活、把派发拉起的子进程绑到随引擎退出的作业；
# Registry 启动时从注册表补齐 PATH（src/startup_env.rs）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

# 进程存活检查与结束子进程（libc::kill）。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

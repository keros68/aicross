<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="aicross — 多厂商 agent 的派发引擎与结果查看器" />
    <title>aicross</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- 首帧前按系统配色设 data-theme，避免闪烁；之后由 src/lib/theme.ts 跟随系统变化。 -->
    <script>
      (function() {
        var theme = 'dark';
        try {
          if (window.matchMedia) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch(e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

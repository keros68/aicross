<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="aicross — 多厂商 agent 的派发引擎与结果查看器" />
    <title>aicross</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Apply theme BEFORE React renders to prevent flash of unstyled variables.
         旧界面还有更多主题，现只保留 dark / light 两套（设置页已删）。 -->
    <script>
      (function() {
        var theme = 'dark';
        try {
          var savedTheme = localStorage.getItem('cc-theme');
          theme = savedTheme === 'light' ? 'light' : 'dark';
          if (savedTheme && savedTheme !== theme) localStorage.setItem('cc-theme', theme);
        } catch(e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
